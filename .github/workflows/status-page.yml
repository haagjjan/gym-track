name: Status page

# GitHub Pages remains independent of the production host. A successful main
# workflow refreshes recruiter-facing build evidence; live operational state
# is still read at runtime from Better Stack and is never inferred from CI.
on:
  workflow_run:
    workflows:
      - repo-checks
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified status page
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify status data behavior
        run: pnpm test:status

      - name: Generate all-source coverage
        run: pnpm test:coverage

      - name: Generate verified build evidence
        env:
          STATUS_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node ops/status/scripts/build-quality-summary.mjs

      - name: Generate public monitoring configuration
        env:
          BETTER_STACK_STATUS_URL: ${{ vars.BETTER_STACK_STATUS_URL }}
        run: node ops/status/scripts/build-runtime-config.mjs

      - name: Verify independent static assets
        run: |
          set -euo pipefail

          test -f ops/status/public/index.html
          test -f ops/status/public/status.css
          test -f ops/status/public/status.js
          test -f ops/status/public/config.json
          test -f ops/status/public/quality.json
          test "$(cat ops/status/public/CNAME)" = "status.gymtrack.ch"
          test "$(grep -Fc '<script type="module" src="./status.js"></script>' ops/status/public/index.html)" = "1"

          if grep -rqiE 'onerror=|onload=|style=' ops/status/public; then
            printf 'ERROR: status assets must not contain inline handlers or styles\n' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ops/status/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
