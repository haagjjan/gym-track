name: repo-checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-checks:
    name: Project checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --check "${BEFORE_SHA}..${CURRENT_SHA}"
          elif git rev-parse --verify "${CURRENT_SHA}^" >/dev/null 2>&1; then
            git diff --check "${CURRENT_SHA}^..${CURRENT_SHA}"
          else
            git diff --check
          fi

      - name: Verify foundation docs
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "ARCHITECTURE.md"
            "ENGINEERING.md"
            "CONTRIBUTING.md"
            "docs/00-workflow.md"
            "docs/01-requirements.md"
            "docs/02-query-list.md"
            "docs/03-data-model-notes.md"
            "docs/04-schema-draft.md"
            "docs/05-api-contract.md"
            "docs/06-implementation-start.md"
            "docs/07-implementation-pattern.md"
            "docs/08-next-implementation-plan.md"
            "docs/repository-structure.md"
            "docs/decisions/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error file=${file}::Required foundation doc is missing"
              exit 1
            fi
          done

      - name: Guard implementation scaffolding
        run: |
          set -euo pipefail

          if [ -d "apps" ] || [ -d "packages" ]; then
            if [ ! -f "package.json" ] || [ ! -f "pnpm-workspace.yaml" ]; then
              echo "::error::apps/ or packages/ requires root package.json and pnpm-workspace.yaml"
              exit 1
            fi
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Run performance regression tests
        run: pnpm test:performance

      - name: Verify hardened container runtime is offline-ready
        run: |
          set -euo pipefail

          docker build --target migrate -t gym-tracker-migrate-runtime-check .
          docker run --rm \
            --network none \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001,mode=0700 \
            gym-tracker-migrate-runtime-check \
            pnpm --version

  api-integration:
    name: API database integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_progress_tracker_test
          POSTGRES_PASSWORD: gym_progress_tracker_password
          POSTGRES_USER: gym_progress_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_progress_tracker -d gym_progress_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gym_progress_tracker:gym_progress_tracker_password@localhost:5432/gym_progress_tracker_test
      INTEGRATION_DATABASE_URL: postgresql://gym_progress_tracker:gym_progress_tracker_password@localhost:5432/gym_progress_tracker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write migration environment
        run: echo "DATABASE_URL=${DATABASE_URL}" > .env

      - name: Run migrations
        run: pnpm migrate:up

      - name: Run API integration tests
        run: pnpm test:integration

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Start local app stack
        run: docker compose up --build -d

      - name: Wait for web
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/signup >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color api web
          exit 1

      - name: Run web smoke tests
        run: pnpm smoke:web

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs --no-color api web

      - name: Stop local app stack
        if: always()
        run: docker compose down
