name: repo-checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-checks:
    name: Project checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --check "${BEFORE_SHA}..${CURRENT_SHA}"
          elif git rev-parse --verify "${CURRENT_SHA}^" >/dev/null 2>&1; then
            git diff --check "${CURRENT_SHA}^..${CURRENT_SHA}"
          else
            git diff --check
          fi

      - name: Verify foundation docs
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "ARCHITECTURE.md"
            "ENGINEERING.md"
            "CONTRIBUTING.md"
            "docs/00-workflow.md"
            "docs/01-requirements.md"
            "docs/02-query-list.md"
            "docs/03-data-model-notes.md"
            "docs/04-schema-draft.md"
            "docs/05-api-contract.md"
            "docs/06-implementation-start.md"
            "docs/07-implementation-pattern.md"
            "docs/08-next-implementation-plan.md"
            "docs/repository-structure.md"
            "docs/decisions/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "::error file=${file}::Required foundation doc is missing"
              exit 1
            fi
          done

      - name: Guard implementation scaffolding
        run: |
          set -euo pipefail

          if [ -d "apps" ] || [ -d "packages" ]; then
            if [ ! -f "package.json" ] || [ ! -f "pnpm-workspace.yaml" ]; then
              echo "::error::apps/ or packages/ requires root package.json and pnpm-workspace.yaml"
              exit 1
            fi
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Run performance regression tests
        run: pnpm test:performance

      - name: Verify hardened container runtime is offline-ready
        run: |
          set -euo pipefail

          docker build --target migrate -t gym-tracker-migrate-runtime-check .
          docker run --rm \
            --network none \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:uid=10001,gid=10001,mode=0700 \
            gym-tracker-migrate-runtime-check \
            /bin/sh -ec 'test -r scripts/promote-admin.mjs; exec pnpm --version'

      - name: Verify staging PostgreSQL initialization
        run: |
          set -euo pipefail

          release_sha="${GITHUB_SHA}"
          postgres_image="gym-tracker-staging-postgres:${release_sha}"
          proxy_image="gym-tracker-staging-proxy:${release_sha}"
          runtime_dir="$(mktemp -d)"
          compose=(docker compose -p gym-tracker-staging-ci -f ops/staging/compose.yaml)

          cleanup() {
            status="$?"
            if [ "${status}" -ne 0 ]; then
              "${compose[@]}" logs --no-color postgres || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            rm -rf -- "${runtime_dir}"
            exit "${status}"
          }
          trap cleanup EXIT

          printf '%s\n' 'ci-owner-password' > "${runtime_dir}/postgres-owner-password"
          printf '%s\n' 'ci-app-password' > "${runtime_dir}/postgres-app-password"
          printf '%s\n' 'ci-bff-secret-at-least-thirty-two-characters' > "${runtime_dir}/bff-client-ip-secret"
          printf '%s\n' 'ci-resend-key' > "${runtime_dir}/resend-api-key"
          printf '%s\n' 'owner-one@example.invalid,owner-two@example.invalid' > "${runtime_dir}/email-recipient-allowlist"
          sudo chown root:10001 "${runtime_dir}"/*
          sudo chmod 0440 "${runtime_dir}"/*

          export APP_RELEASE="${release_sha}"
          export STAGING_POSTGRES_IMAGE="${postgres_image}"
          export STAGING_MIGRATE_IMAGE="gym-tracker-staging-migrate:${release_sha}"
          export STAGING_API_IMAGE="gym-tracker-staging-api:${release_sha}"
          export STAGING_WEB_IMAGE="gym-tracker-staging-web:${release_sha}"
          export STAGING_PROXY_IMAGE="${proxy_image}"
          export STAGING_CADDYFILE="${GITHUB_WORKSPACE}/ops/staging/Caddyfile"
          export POSTGRES_OWNER_PASSWORD_FILE="${runtime_dir}/postgres-owner-password"
          export POSTGRES_APP_PASSWORD_FILE="${runtime_dir}/postgres-app-password"
          export BFF_CLIENT_IP_SECRET_FILE="${runtime_dir}/bff-client-ip-secret"
          export RESEND_API_KEY_FILE="${runtime_dir}/resend-api-key"
          export EMAIL_RECIPIENT_ALLOWLIST_FILE="${runtime_dir}/email-recipient-allowlist"
          export SUPPORT_EMAIL="support@example.invalid"
          export CONTROLLER_NAME="CI Controller"
          export CONTROLLER_ADDRESS="CI only"
          export PRIVACY_EMAIL="privacy@example.invalid"
          export SECURITY_EMAIL="security@example.invalid"

          docker build \
            -f ops/staging/postgres/Dockerfile \
            -t "${postgres_image}" \
            .
          docker build \
            -f ops/staging/caddy/Dockerfile \
            -t "${proxy_image}" \
            .
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "${proxy_image}" \
            caddy version
          "${compose[@]}" config --quiet
          "${compose[@]}" config --format json | node -e '
            let source = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const services = JSON.parse(source).services;
              const apiCommand = services.api.command.join(" ");
              const webCommand = services.web.command.join(" ");
              if (!apiCommand.includes("exec node dist/main.js") || apiCommand.includes("pnpm")) {
                throw new Error("Staging API command is incompatible with the hardened runtime image");
              }
              if (!webCommand.includes("exec node apps/web/server.js") || webCommand.includes("pnpm")) {
                throw new Error("Staging web command is incompatible with the hardened runtime image");
              }
            });
          '
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" exec -T postgres awk \
            '/^Groups:/ { for (i = 2; i <= NF; i++) if ($i == 10001) found = 1 } END { exit !found }' \
            /proc/1/status
          role_exists="$("${compose[@]}" exec -T postgres psql -X -At \
            -U gym_tracker_staging_owner \
            -d gym_tracker_staging \
            -c "SELECT 1 FROM pg_roles WHERE rolname = 'gym_tracker_staging_app'")"
          test "${role_exists}" = "1"

  api-integration:
    name: API database integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gym_progress_tracker_test
          POSTGRES_PASSWORD: gym_progress_tracker_password
          POSTGRES_USER: gym_progress_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_progress_tracker -d gym_progress_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gym_progress_tracker:gym_progress_tracker_password@localhost:5432/gym_progress_tracker_test
      INTEGRATION_DATABASE_URL: postgresql://gym_progress_tracker:gym_progress_tracker_password@localhost:5432/gym_progress_tracker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write migration environment
        run: echo "DATABASE_URL=${DATABASE_URL}" > .env

      - name: Run migrations
        run: pnpm migrate:up

      - name: Run API integration tests
        run: pnpm test:integration

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          set -euo pipefail

          version="$(pnpm exec playwright --version | awk '{ print $2 }')"
          test -n "${version}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # --with-deps runs apt-get update first. A stalled Ubuntu mirror must fail
          # fast and fall through to the next one instead of hanging the job.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null

          pnpm exec playwright install --with-deps chromium firefox

      - name: Reuse cached Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail

          verify_browsers() {
            node - <<'NODE'
          const { chromium, firefox } = require("@playwright/test");

          Promise.all(
            [chromium, firefox].map(async (browserType) => {
              const browser = await browserType.launch();
              await browser.close();
            })
          ).catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          }

          pnpm exec playwright install chromium firefox

          # The runner image already carries the shared libraries these browsers
          # need, so the apt step is skipped. Install them on demand if a real
          # launch proves otherwise.
          if ! verify_browsers; then
            pnpm exec playwright install-deps chromium firefox
            verify_browsers
          fi

      - name: Start local app stack
        run: docker compose up --build -d

      - name: Wait for web
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/signup >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs --no-color api web
          exit 1

      - name: Run web smoke tests
        run: |
          set -euo pipefail

          restart_api() {
            docker compose restart api

            for attempt in {1..30}; do
              if curl -fsS http://localhost:4000/api/v1/health >/dev/null; then
                return
              fi

              sleep 2
            done

            docker compose ps
            docker compose logs --no-color api
            exit 1
          }

          run_project() {
            local project="$1"

            # Local Compose collapses browser traffic onto one BFF client key.
            # Keep each realistic product-flow batch below the real per-client
            # quota instead of weakening or disabling rate limiting in CI.
            pnpm exec playwright test \
              apps/web/e2e/auth-workout-smoke.spec.ts \
              --project="${project}" \
              --workers=1

            restart_api

            pnpm exec playwright test \
              apps/web/e2e/muscle-spike-anatomy.spec.ts \
              apps/web/e2e/volume-mobile-gesture.spec.ts \
              apps/web/e2e/workout-templates.spec.ts \
              --project="${project}" \
              --workers=1
          }

          run_project chromium
          restart_api
          run_project firefox

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs --no-color api web

      - name: Stop local app stack
        if: always()
        run: docker compose down
