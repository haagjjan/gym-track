previews:
  generation: manual

services:
  - type: web
    name: gym-progress-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render-api
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    preDeployCommand: cd apps/api && pnpm exec node-pg-migrate --config-file db/migrate.json up
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: API_TRUST_PROXY
        value: "false"
      - key: APP_BASE_URL
        value: https://app.gymtrack.ch
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AUTH_COOKIE_NAME
        value: gym_progress_session
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SESSION_TTL_DAYS
        value: "30"
      - key: REGISTRATION_MODE
        value: INVITE_ONLY
      - key: BFF_CLIENT_IP_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: TELEGRAM_BETA_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BETA_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gym-progress-tracker-db
          property: connectionString

  - type: web
    name: gym-progress-tracker-web
    runtime: docker
    dockerfilePath: ./Dockerfile.render-web
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /signup
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_HOST
        value: 0.0.0.0
      - key: WEB_PORT
        value: "10000"
      - key: APP_BASE_URL
        value: https://app.gymtrack.ch
      - key: APP_ENV
        value: production
      - key: APP_ALLOWED_HOSTS
        value: app.gymtrack.ch,gym-progress-tracker-web.onrender.com
      - key: HSTS_ENABLED
        value: "false"
      - key: REGISTRATION_MODE
        value: INVITE_ONLY
      - key: BFF_CLIENT_IP_SECRET
        sync: false
      - key: NEXT_PUBLIC_CONTROLLER_NAME
        sync: false
      - key: NEXT_PUBLIC_CONTROLLER_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_PRIVACY_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SECURITY_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_URL
        sync: false
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: gym-progress-tracker-api
          property: hostport

databases:
  - name: gym-progress-tracker-db
    plan: basic-256mb
    region: oregon
    databaseName: gym_progress_tracker
    user: gym_progress_tracker
    postgresMajorVersion: "17"
    ipAllowList: []
