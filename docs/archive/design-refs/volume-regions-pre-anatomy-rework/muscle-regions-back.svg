<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 1024">
  <!--
    Muscle-region ID map — BACK view (as seen from behind: image left =
    the figure's anatomical left = world −z). Coordinates: x maps lateral
    zn ∈ [−1.15, +1.15] left→right, y maps yn head(0)→feet(1024).
    Fill encodes the region id via REGION_PALETTE (region-map.ts); background/gaps are id 0 (black).
    Every path carries a background-colored stroke so touching/overlapping
    shapes always keep a separation gap (painter's order resolves overlaps:
    later shapes sit on top). Left-side shapes are mirrored via <use>;
    symmetric center shapes overhang x=330 so the mirror's fill covers the
    center-line stroke (no black spine seam).
    Region ids: 2 back, 3 traps, 4 shoulders, 5 biceps, 6 triceps,
    7 forearms, 9 glutes, 11 hamstrings, 12 calves. The upper arm is split
    along its axis: biceps = top half, triceps = bottom half (flex pose).
    Shapes may overhang the silhouette to keep side-facing blends colored.
    The 2D body-map view restyles via data-region.
  -->
  <rect width="660" height="1024" fill="rgb(0,0,0)" data-region="none" />

  <g id="back-left" stroke="rgb(0,0,0)" stroke-width="5">
    <!-- back: lats + mid/lower back as one slab, blades to waist; bulges past
         the silhouette at the lat sweep so it reads from the side too.
         Authored as ONE symmetric full-width shape: the <use> mirror maps it
         onto itself exactly, so no center-line stroke can show as a spine seam. -->
    <path data-region="back" fill="rgb(0,255,0)"
      d="M204,306 C200,262 220,226 256,210 C270,202 300,202 330,204 C360,202 390,202 404,210 C440,226 460,262 456,306 C450,358 426,408 394,440 C370,448 344,448 330,446 C316,448 290,448 266,440 C234,408 210,358 204,306 Z" />
    <!-- biceps: TOP half of the flexed upper arm — visible from behind too -->
    <path data-region="biceps" fill="rgb(255,0,255)"
      d="M208,158 C165,140 112,136 82,150 C72,164 72,182 78,196 C120,204 170,208 205,212 C210,196 211,174 208,158 Z" />
    <!-- triceps: BOTTOM half of the upper arm down past the elbow horseshoe -->
    <path data-region="triceps" fill="rgb(0,255,255)"
      d="M76,200 C69,216 73,236 88,248 C130,264 182,272 218,272 C221,254 215,232 206,216 C160,212 112,206 76,200 Z" />
    <!-- forearms: full limb from elbow to wrist (fist stays unmapped). Drawn
         AFTER the upper-arm halves: the raised forearm crosses the arm ball in
         projection space, and the forearm is the outer-visible surface there. -->
    <path data-region="forearms" fill="rgb(255,128,0)"
      d="M66,190 C58,212 72,234 100,242 C112,242 122,238 126,230 L200,102 C205,92 203,80 190,75 C177,70 166,74 160,84 L66,190 Z" />
    <!-- shoulders: full round rear-delt head capping the arm root -->
    <path data-region="shoulders" fill="rgb(255,255,0)"
      d="M258,190 C252,166 232,152 210,150 C192,150 178,162 175,178 C173,202 182,228 196,250 C207,266 226,270 242,264 C254,256 259,238 258,220 L258,190 Z" />
    <!-- traps: one continuous muscle — wide wings out to the delts (meeting the
         front map's band over the shoulder line), kite tail to mid-back.
         Symmetric full-width shape for the same no-spine-seam reason as back. -->
    <path data-region="traps" fill="rgb(0,0,255)"
      d="M330,132 C306,134 268,144 226,158 C218,166 220,178 230,184 C276,196 310,244 320,310 C325,316 335,316 340,310 C350,244 384,196 430,184 C440,178 442,166 434,158 C392,144 354,134 330,132 Z" />
    <!-- glutes -->
    <path data-region="glutes" fill="rgb(128,255,0)"
      d="M326,444 C296,438 266,450 256,476 C250,504 262,532 288,542 C312,548 326,538 328,512 C330,488 330,462 326,444 Z" />
    <!-- hamstrings: rear thigh, ending above the knee crease -->
    <path data-region="hamstrings" fill="rgb(0,128,255)"
      d="M312,556 C278,548 244,560 236,590 C231,624 238,654 258,668 C280,680 304,674 310,650 C316,616 316,584 312,556 Z" />
    <!-- calves: big gastroc mass — nearly the whole back of the lower leg,
         from below the knee to the achilles taper, overhanging the outer edge -->
    <path data-region="calves" fill="rgb(255,255,255)"
      d="M300,698 C270,690 244,700 236,730 C230,772 236,822 250,862 C258,884 276,894 292,886 C304,876 310,848 310,808 C310,768 308,726 300,698 Z" />
  </g>
  <use href="#back-left" transform="translate(660,0) scale(-1,1)" />
</svg>
