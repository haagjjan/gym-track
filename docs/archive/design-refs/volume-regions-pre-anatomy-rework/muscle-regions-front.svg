<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 1024">
  <!--
    Muscle-region ID map — FRONT view (as seen from the front: image left =
    the figure's anatomical right = world +z). Coordinates: x maps lateral
    zn ∈ [+1.15, −1.15] left→right, y maps yn head(0)→feet(1024).
    Fill encodes the region id via REGION_PALETTE (region-map.ts); background/gaps are id 0 (black).
    Every path carries a background-colored stroke so touching/overlapping
    shapes always keep a separation gap (painter's order resolves overlaps:
    later shapes sit on top). Left-side shapes are mirrored via <use>.
    Region ids: 1 chest, 2 back (lat sliver), 3 traps, 4 shoulders, 5 biceps,
    6 triceps, 7 forearms, 8 abs, 10 quads, 12 calves. The upper arm is split
    along its axis: biceps = top half, triceps = bottom half (flex pose, so
    the split reads the same from every side). Shapes may overhang the body
    silhouette: the projection only shows them where fragments exist, and the
    overhang keeps side-facing fragments (front/back blend) fully colored.
    The 2D body-map view restyles via data-region.
  -->
  <rect width="660" height="1024" fill="rgb(0,0,0)" data-region="none" />

  <g id="front-left" stroke="rgb(0,0,0)" stroke-width="5">
    <!-- back: lat sliver at the torso edge — lats pop out beside the chest,
         mostly outside the front silhouette so it colors side-facing blends -->
    <path data-region="back" fill="rgb(0,255,0)"
      d="M228,280 C212,274 198,280 194,296 C190,326 196,360 208,388 C216,402 230,402 236,390 C232,354 230,314 228,280 Z" />
    <!-- biceps: TOP half of the flexed upper arm (peak points up in this pose) -->
    <path data-region="biceps" fill="rgb(255,0,255)"
      d="M208,158 C165,140 112,136 82,150 C72,164 72,182 78,196 C120,204 170,208 205,212 C210,196 211,174 208,158 Z" />
    <!-- triceps: BOTTOM half of the upper arm, wrapping under toward the armpit -->
    <path data-region="triceps" fill="rgb(0,255,255)"
      d="M76,200 C70,214 74,232 88,242 C130,258 180,266 216,268 C219,252 214,232 206,216 C160,212 112,206 76,200 Z" />
    <!-- forearms: full limb from elbow to wrist (fist stays unmapped). Drawn
         AFTER the upper-arm halves: the raised forearm crosses the arm ball in
         projection space, and the forearm is the front-visible surface there. -->
    <path data-region="forearms" fill="rgb(255,128,0)"
      d="M66,190 C58,212 72,234 100,242 C112,242 122,238 126,230 L200,102 C205,92 203,80 190,75 C177,70 166,74 160,84 L66,190 Z" />
    <!-- chest: pec plate, rounded out toward the arm/armpit (sternum gap at center) -->
    <path data-region="chest" fill="rgb(255,0,0)"
      d="M324,208 C296,200 252,204 234,228 C226,242 224,260 232,277 C242,296 262,308 288,310 C308,310 320,306 324,300 Z" />
    <!-- shoulders: full round delt head capping the arm root (overdraws arm + chest edge) -->
    <path data-region="shoulders" fill="rgb(255,255,0)"
      d="M258,192 C252,166 232,152 210,150 C192,150 178,162 175,180 C173,204 182,230 196,252 C207,268 226,272 242,266 C254,258 259,240 258,222 L258,192 Z" />
    <!-- traps: neck→shoulder slope, one continuous band over to the back map -->
    <path data-region="traps" fill="rgb(0,0,255)"
      d="M318,156 C290,138 252,138 218,152 C214,160 216,168 224,172 C256,162 292,170 314,184 C318,175 320,165 318,156 Z" />
    <!-- abs: central plate (symmetric, mirror overlays itself) -->
    <path data-region="abs" fill="rgb(128,0,255)"
      d="M298,314 L362,314 C372,348 372,398 360,430 L300,430 C288,398 288,348 298,314 Z" />
    <!-- quads: front thigh, ending above the knee cap -->
    <path data-region="quads" fill="rgb(255,0,128)"
      d="M252,448 C226,462 214,514 220,574 C225,618 238,650 262,660 C286,666 302,650 306,614 C312,560 308,504 295,466 C285,448 266,442 252,448 Z" />
    <!-- calves: outer sliver below the knee — the gastroc head peeking from the
         front, continuous with the big mass on the back map -->
    <path data-region="calves" fill="rgb(255,255,255)"
      d="M244,704 C232,708 222,730 222,764 C222,808 228,848 238,872 C244,884 252,878 254,860 C252,818 250,762 250,722 C250,708 248,702 244,704 Z" />
  </g>
  <use href="#front-left" transform="translate(660,0) scale(-1,1)" />
</svg>
